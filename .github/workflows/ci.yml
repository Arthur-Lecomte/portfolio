# Continuous integration — runs on every pull request and every push to
# main. Merging is only allowed when this workflow is green (branch
# protection is configured at go-live, see docs/deploiement.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check Astro and TypeScript files
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
