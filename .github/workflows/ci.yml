# Continuous integration — runs on every pull request and every push to
# main. Merging is only allowed when this workflow is green (branch
# protection is configured at go-live, see docs/deploiement.md).
# npm run build itself already runs: content verification, header
# verification and the demo pipeline with its security scan (prebuild).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci
        env:
          # The a11y step uses the runner's Chrome, not puppeteer's copy.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check formatting
        run: npm run format:check

      - name: Type-check Astro and TypeScript files
        run: npm run check

      - name: Build the site (content, headers and demo checks included)
        run: npm run build

      - name: Check internal links on the built site
        run: node scripts/check-links.mjs

      - name: Accessibility on main pages (WCAG 2 AA)
        run: node scripts/test-a11y.mjs
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Build every availability state and the empty launch state
        run: node scripts/test-states.mjs

      - name: Audit site dependencies
        run: npm audit --audit-level=high

      - name: Audit demo dependencies
        run: node scripts/audit-demos.mjs
