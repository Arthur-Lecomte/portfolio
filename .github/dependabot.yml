# Weekly dependency updates for the site, the GitHub Actions and, later,
# each demo (demos keep their own package.json — add one entry per demo
# directory when a demo with dependencies is created).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      # @astrojs/check only accepts typescript ^5 || ^6 — remove this
      # once it supports 7.x (see closed PR #1).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
